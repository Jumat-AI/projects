# ==============================================================================
# Konfigurasi Nginx: project.jumat.ai.id (Server Pribadi / VPS)
# Lokasi file di server: /etc/nginx/sites-available/project.jumat.ai.id
# ==============================================================================

# 1. Definisi Rate Limiting untuk mencegah flooding/abuse (30 req/detik per IP)
limit_req_zone $binary_remote_addr zone=project_ratelimit:10m rate=30r/s;

# 2. Redirect HTTP ke HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name project.jumat.ai.id;

    # Let's Encrypt ACME challenge (jika memperbarui sertifikat via certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 3. Server HTTPS Utama
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name project.jumat.ai.id;

    # Sertifikat SSL (Ganti dengan path LetsEncrypt Anda)
    ssl_certificate /etc/letsencrypt/live/project.jumat.ai.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/project.jumat.ai.id/privkey.pem;

    # Pengaturan SSL modern
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Direktori root deployment
    root /var/www/project.jumat.ai.id;
    index index.html;

    # Perlindungan keamanan: Cegah akses melompat via symlink
    disable_symlinks on from_file_path;

    # Terapkan Rate Limiting
    limit_req zone=project_ratelimit burst=60 nodelay;

    # ==========================================================================
    # Security Headers
    # ==========================================================================
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Isolasi Service Worker: Cegah project menyadap scope global root
    add_header Service-Worker-Allowed "" always;

    # Gzip Compression untuk menghemat bandwidth server
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/wasm image/svg+xml;

    # ==========================================================================
    # Routing 1: Portal Hub / Katalog Utama (project.jumat.ai.id/)
    # ==========================================================================
    location = / {
        alias /var/www/project.jumat.ai.id/hub/;
        try_files /index.html =404;
    }

    # Aset statis Hub (styles.css, app.js, projects.json)
    location ~ ^/(styles\.css|app\.js|projects\.json)$ {
        root /var/www/project.jumat.ai.id/hub;
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # ==========================================================================
    # Routing 2: Proyek Komunitas (project.jumat.ai.id/<nama_project>/...)
    # ==========================================================================
    location ~ ^/([a-zA-Z0-9-]+)(/.*)?$ {
        set $proj_slug $1;
        set $proj_subpath $2;

        alias /var/www/project.jumat.ai.id/projects/$proj_slug$proj_subpath;
        index index.html;
        try_files $proj_subpath $proj_subpath/ /projects/$proj_slug/index.html =404;

        # Caching aset static proyek (gambar, js, css, wasm)
        location ~* \.(css|js|mjs|png|jpg|jpeg|gif|ico|svg|webp|woff2|wasm)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800, no-transform";
        }
    }

    # ==========================================================================
    # Blokir & Proteksi
    # ==========================================================================
    # Blokir akses ke file rahasia / dotfiles (.git, .env, dll)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Blokir eksekusi skrip server apa pun (PHP/Python/Perl/Bash)
    location ~ \.(php|py|sh|pl|cgi)$ {
        deny all;
        return 403;
    }
}
