version: '3.8'

# ==============================================================================
# DOCKER-COMPOSE TEMPLATE PROYEK KOMUNITAS JUMAT.AI
# Aturan Keamanan Wajib:
# 1. DILARANG menggunakan 'ports:' (port mapping ke host dilarang demi keamanan)
# 2. WAJIB menggunakan batasan resource; TOTAL semua service maks CPU 0.5 & Memory 512M per proyek
# 3. WAJIB terhubung ke network terisolasi 'jumat-ai-web'
# ==============================================================================

services:
  nama-project-anda:
    container_name: jumat-ai-nama-project-anda
    build:
      context: .
      args:
        REPO_URL: "https://github.com/username_anda/repo-proyek-anda.git"
        # Hash commit lengkap (40 karakter), harus sama dengan commit_sha di project.json
        COMMIT_SHA: "0000000000000000000000000000000000000000"
    restart: unless-stopped

    # Expose port internal container ke network Traefik (bukan port mapping ke host)
    expose:
      - "3000"

    # Terhubung hanya ke network terisolasi Traefik untuk Jumat.AI
    networks:
      - traefik-net

    # Batasan Resource untuk menjaga stabilitas server bersama
    deploy:
      resources:
        limits:
          cpus: '0.5'        # Total semua service maks 0.5 vCPU per proyek
          memory: 512M       # Total semua service maks 512M per proyek

    # Konfigurasi Routing Traefik
    labels:
      - "traefik.enable=true"
      # Beritahu Traefik network yang digunakan
      - "traefik.docker.network=jumat-ai-web"
      # Routing path: projects.jumat.ai.id/nama-project-anda
      - "traefik.http.routers.nama-project-anda.rule=Host(`projects.jumat.ai.id`) && PathPrefix(`/nama-project-anda`)"
      - "traefik.http.routers.nama-project-anda.entrypoints=websecure"
      - "traefik.http.routers.nama-project-anda.tls=true"
      # Middleware strip prefix agar aplikasi menerima request dari '/'
      - "traefik.http.middlewares.nama-project-anda-strip.stripprefix.prefixes=/nama-project-anda"
      - "traefik.http.routers.nama-project-anda.middlewares=nama-project-anda-strip"
      # Port internal tempat aplikasi mendengarkan request
      - "traefik.http.services.nama-project-anda.loadbalancer.server.port=3000"

networks:
  traefik-net:
    name: jumat-ai-web
    external: true
