version: '3.8'

services:
  hub:
    container_name: jumat-ai-hub
    build:
      context: .
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - traefik-net
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=jumat-ai-web"
      - "traefik.http.routers.jumat-ai-hub.rule=Host(`projects.jumat.ai.id`) && PathPrefix(`/`)"
      - "traefik.http.routers.jumat-ai-hub.priority=1"
      - "traefik.http.routers.jumat-ai-hub.entrypoints=websecure"
      - "traefik.http.routers.jumat-ai-hub.tls=true"
      - "traefik.http.services.jumat-ai-hub.loadbalancer.server.port=80"

networks:
  traefik-net:
    name: jumat-ai-web
    external: true
